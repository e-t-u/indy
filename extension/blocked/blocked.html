<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indy — Connection Blocked by Certificate Policy</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="Indy Shield" class="brand-icon">
        <div>
          <span class="eyebrow">INDY CERTIFICATE ENFORCEMENT</span>
          <h1>Connection Blocked — Denied Certificate Authority</h1>
        </div>
      </div>
      <button id="btn-open-options" type="button" class="btn-secondary-sm">Open Certificate Database</button>
    </header>

    <section class="deny-banner">
      <div class="deny-row">
        <span class="deny-label">Blocked Destination:</span>
        <code id="blocked-url" class="blocked-url">Loading...</code>
      </div>
      <div class="deny-row">
        <span class="deny-label">Reason:</span>
        <span id="blocked-reason" class="blocked-reason">Evaluating certificate chain...</span>
      </div>
    </section>

    <section class="chain-section">
      <h2>Denied Certificate Chain Details</h2>
      <div id="denied-chain-list" class="chain-list"></div>
    </section>

    <footer class="actions-bar">
      <button id="btn-switch-ask" type="button" class="btn btn-ask">
        Change Policy to "Ask" &amp; Review Prompt
      </button>
      <button id="btn-switch-accept" type="button" class="btn btn-accept">
        Change Policy to "Accept" &amp; Proceed
      </button>
    </footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
