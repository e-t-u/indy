<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indy Certificate Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="Indy" class="logo">
      <div>
        <div class="title">Indy Certificate Guard</div>
        <div class="subtitle" id="db-stats">Loading database...</div>
      </div>
    </div>
    <button id="btn-options" type="button" class="btn-manage">Database</button>
  </header>

  <section id="tab-panel" class="tab-panel">
    <div class="host-bar">
      <span class="host-label" id="active-host">Inspecting tab...</span>
      <span class="status-pill" id="active-decision">...</span>
    </div>
    <div id="chain-container" class="chain-container"></div>
  </section>

  <footer class="popup-footer">
    <button id="btn-sync" type="button" class="btn-footer">Sync OS Root Store</button>
    <button id="btn-test-indy" type="button" class="btn-footer accent">Test "indy" Root Chain</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
